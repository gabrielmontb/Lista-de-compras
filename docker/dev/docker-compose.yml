services:

  postgres:

    image: postgres:17

    container_name: listaDeCompras-postgres

    restart: unless-stopped

    environment:

      POSTGRES_USER: admin

      POSTGRES_PASSWORD: admin

      POSTGRES_DB: listaDeCompras

    ports:

      - "5432:5432"

    volumes:

      - postgres-data:/var/lib/postgresql/data

volumes:

  postgres-data: